name: Source Check

# 手動執行：只檢查新聞來源與台股融資融券資料能不能抓到（不呼叫 AI、不花費用、不更新晨報）。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Fetch every enabled source (no LLM)
        env:
          REPORT_TZ: Asia/Taipei
        run: npm run dry-run
      - name: Check 24h-asset alignment to US close
        run: npx tsx scripts/check-alignment.ts
